<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tranquil Boost</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="logo.svg" alt="" class="brand-logo">
      <span class="brand-name">Tranquil Boost</span>
    </div>
    <div class="titlebar-status" id="admin-pill"></div>
    <div class="win-buttons">
      <button class="win-btn" data-win="minimize" title="Minimize">
        <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
      </button>
      <button class="win-btn" data-win="maximize" title="Maximize">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="win-btn close" data-win="close" title="Close">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="nav"></nav>
    <main class="content" id="page"></main>
  </div>

  <div class="restart-bar hidden" id="restart-bar">
    <span id="restart-text">Restart your PC so every change kicks in.</span>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
